<style>
:root {
  /* Layout: full-height app — graph canvas left, inspector rail right; summary strip on top. */
  --bg: #f6f7f4;

  --edge-faint: rgba(40,50,40,.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111410; --panel: #181c17; --ink: #e7ebe3; --muted: #9aa396;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111410; --panel: #181c17; --ink: #e7ebe3; --muted: #9aa396;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
#stage { position: relative; min-height: 0; overflow: hidden; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
.edge { fill: none; stroke-width: 1; }
.node circle { stroke: var(--panel); stroke-width: 1.2; cursor: pointer; }
.node text { font-size: 9px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.node.hub text { font-size: 13px; font-weight: 600; }
.dim { opacity: .08; }
.hl circle { stroke: var(--ink); stroke-width: 2; }
.toolbar { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 10px 3px 8px; font: 500 12px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
#search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--font-body); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.card h3 { margin: 0 0 2px; font-size: 17px; }
.meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; font-weight: 500; }
.rel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rel li { border-left: 3px solid var(--line); padding: 2px 0 2px 9px; }
.rel .who { font-weight: 600; cursor: pointer; }
.rel .who:hover { text-decoration: underline; }
.rel .d { color: var(--muted); font-size: 12.5px; }
.rel a { color: var(--accent); font-size: 12px; text-decoration: none; }
.rel a:hover { text-decoration: underline; }
.ins { display: flex; flex-direction: column; gap: 14px; }
.ins p { margin: 0 0 4px; color: var(--muted); font-size: 12.5px; max-width: 65ch; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
.tag:hover { border-color: var(--accent); }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 6px; align-items: center; font-size: 12.5px; }
.bar div { height: 8px; background: var(--accent); border-radius: 2px; }
.bar span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.legend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
button.clear { align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 10px; font: 12px var(--font-body); cursor: pointer; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  partner:"Partners with", competitor:"Competes with", regulator:"Regulates", ecosystem:"Deal with", leadership:"Leads" };
const CAT_COL = { "NVIDIA":"#76B900", "AI lab":"#2E6FD8", "Big tech":"#5A8FE0", "AI cloud":"#F08A24", "Sovereign AI":"#C9A227",

const nodeById = new Map(DATA.nodes.map(n => [n.id, n]));
const active = new Set(Object.keys(TYPE_COL).filter(t => t !== "leadership"));
let selected = null;

// ---- header stats
const s = DATA.stats;
document.getElementById("stats").innerHTML =
  `<span><b>${s.nodes}</b> organizations &amp; people</span><span><b>${s.edges}</b> sourced relationships</span>` +
  `<span><b>${s.types.investment}</b> investments</span><span><b>${s.types.acquisition}</b> acquisitions</span>` +
  `<span><b>${s.sources}</b> sources · built with NetworkX · data to ${DATA.generated}</span>`;

// ---- graph
const svg = d3.select("#svg"), g = svg.append("g");
const R = 430;                        // layout radius in px
const X = n => n.x * R, Y = n => -n.y * R;
const size = n => n.id === "NVIDIA" ? 26 : 3.2 + Math.sqrt(n.degree) * 2.1;

const edgeSel = g.append("g").selectAll("path").data(DATA.edges).join("path")
  .attr("class", "edge")
  .attr("d", e => { const a = nodeById.get(e.s), b = nodeById.get(e.t);
    const x1 = X(a), y1 = Y(a), x2 = X(b), y2 = Y(b);
    if (e.s === "NVIDIA" || e.t === "NVIDIA") return `M${x1},${y1}L${x2},${y2}`;
    const mx = (x1 + x2) / 2 * 0.82, my = (y1 + y2) / 2 * 0.82;     // bow third-party ties toward the centre
    return `M${x1},${y1}Q${mx},${my} ${x2},${y2}`; })
  .attr("stroke", e => TYPE_COL[e.type]);

const nodeSel = g.append("g").selectAll("g").data(DATA.nodes).join("g")
  .attr("class", n => "node" + (n.id === "NVIDIA" ? " hub" : ""))
  .attr("transform", n => `translate(${X(n)},${Y(n)})`)
  .on("click", (ev, n) => { ev.stopPropagation(); select(n.id); });
nodeSel.append("circle").attr("r", size).attr("fill", n => CAT_COL[n.category]);
nodeSel.append("title").text(n => `${n.id} — ${n.category}`);
nodeSel.append("text").text(n => n.id)
  .attr("text-anchor", n => n.id === "NVIDIA" ? "middle" : (n.x >= 0 ? "start" : "end"))
  .attr("dx", n => n.id === "NVIDIA" ? 0 : (n.x >= 0 ? size(n) + 3 : -size(n) - 3))
  .attr("dy", n => n.id === "NVIDIA" ? 4 : 3);

const zoom = d3.zoom().scaleExtent([0.4, 8]).on("zoom", ev => g.attr("transform", ev.transform));
svg.call(zoom).on("click", () => select(null));
function fit() {
  const el = document.getElementById("stage"), w = el.clientWidth, h = el.clientHeight;
  const k = Math.min(w, h - 70) / (2 * R + 180);
  svg.call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2 + 34).scale(k));
}
fit(); addEventListener("resize", fit);

// ---- filters
const tb = document.getElementById("toolbar");
Object.keys(TYPE_COL).forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.id = "chip-" + t; b.setAttribute("aria-pressed", active.has(t));
  b.innerHTML = `<i style="background:${TYPE_COL[t]}"></i>${t} <span style="color:var(--muted)">${s.types[t] || 0}</span>`;
  b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); b.setAttribute("aria-pressed", active.has(t)); render(); };
  tb.appendChild(b);
});

function render() {
  const sel = selected;
  const near = new Set();
  if (sel) { near.add(sel); DATA.edges.forEach(e => { if (!active.has(e.type)) return;
    if (e.s === sel) near.add(e.t); if (e.t === sel) near.add(e.s); }); }
  const visibleNodes = new Set(["NVIDIA"]);
  DATA.edges.forEach(e => { if (active.has(e.type)) { visibleNodes.add(e.s); visibleNodes.add(e.t); } });
  edgeSel.attr("display", e => active.has(e.type) ? null : "none")
    .attr("stroke-opacity", e => !sel ? (e.type === "partner" || e.type === "ecosystem" ? .22 : .45)
      : (e.s === sel || e.t === sel ? .95 : .04))
    .attr("stroke-width", e => sel && (e.s === sel || e.t === sel) ? 1.8 : 1);
  nodeSel.classed("dim", n => !visibleNodes.has(n.id) || (sel && !near.has(n.id)))
    .classed("hl", n => n.id === sel);
}

// ---- detail panel
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function select(id) {
  selected = id; render();
  const box = document.getElementById("detail");
  if (!id) { box.innerHTML = defaultDetail(); bindTags(box); return; }
  const n = nodeById.get(id);
  const rels = DATA.edges.filter(e => e.s === id || e.t === id);
  const items = rels.map(e => {
    const other = e.s === id ? e.t : e.s, out = e.s === id;
    const verb = out ? TYPE_LABEL[e.type] : ({ investment:"Funded by", acquisition:"Acquired by", supplier:"Supplied by",
      customer:"Buys from", partner:"Partners with", competitor:"Competes with", regulator:"Regulated by",
      ecosystem:"Deal with", leadership:"Led by" })[e.type];
    const src = DATA.sources[e.src];
    return `<li style="border-color:${TYPE_COL[e.type]}"><div>${verb} <span class="who" data-id="${esc(other)}" tabindex="0">${esc(other)}</span>${e.date ? ` <span class="d">· ${esc(e.date)}</span>` : ""}</div>
      <div class="d">${esc(e.detail)}</div><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a></li>`;
  }).join("");
  const ties = n.nvidia_ties.map(t => `<span class="pill" style="background:${TYPE_COL[t]}">${t}</span>`).join("");
  box.innerHTML = `<div class="card"><h3>${esc(n.id)}</h3>
    <div class="meta">${esc(n.category)} · ${esc(n.country)} · ${n.degree} neighbours · betweenness ${n.betweenness}</div>
    ${ties ? `<div class="pills">${ties}</div>` : ""}
    <h2>${rels.length} relationships</h2><ul class="rel">${items}</ul></div>
    <button class="clear" id="clearSel">Show whole network</button>`;
  box.querySelectorAll(".who").forEach(el => { el.onclick = () => select(el.dataset.id);
    el.onkeydown = ev => { if (ev.key === "Enter") select(el.dataset.id); }; });
  document.getElementById("clearSel").onclick = () => select(null);
}
function defaultDetail() {
  return `<h2>How to read it</h2><p class="d" style="margin:0;color:var(--muted);font-size:12.5px">Each wedge is a category, and node size reflects how many ties a company has. Lines from the centre are NVIDIA's own relationships; curved lines are deals between third parties. Click any name below or in the graph to see every relationship with its source.</p>`;
}

// ---- search
const dl = document.getElementById("names");
DATA.nodes.map(n => n.id).sort().forEach(id => { const o = document.createElement("option"); o.value = id; dl.appendChild(o); });
document.getElementById("search").addEventListener("change", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const hit = DATA.nodes.find(n => n.id.toLowerCase() === q) || DATA.nodes.find(n => n.id.toLowerCase().includes(q));
  if (hit) select(hit.id);
});

// ---- legend
const lg = document.getElementById("legend");
DATA.categories.forEach(c => {
  const sp = document.createElement("span");
  sp.innerHTML = `<i style="background:${CAT_COL[c]}"></i>${c} <span style="color:var(--muted)">${DATA.stats.categories[c]}</span>`;
  lg.appendChild(sp);
});

// ---- insights
const I = DATA.insights;
const tags = arr => `<div class="tags">${arr.map(x => `<button class="tag" data-id="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
const maxB = I.top_betweenness[0][1];
document.getElementById("insights").innerHTML = `
  <h2>What NetworkX finds</h2>
  <div><p><b>Brokers.</b> Betweenness centrality with NVIDIA removed shows who connects the rest of the ecosystem. OpenAI and Google tie for first: both buy from NVIDIA, fund or build rival chips, and bridge clouds, chipmakers and labs.</p>
  ${I.top_betweenness.slice(0, 8).map(([n, b]) => `<div class="bar"><span>${esc(n)}</span><div style="width:${(b / maxB * 100).toFixed(0)}%"></div><span>${b.toFixed(2)}</span></div>`).join("")}</div>
  <div><p><b>Circular deals.</b> NVIDIA has invested in ${I.circular.length} companies that are also its customers, so some of the money comes back as GPU orders.</p>${tags(I.circular)}</div>
  <div><p><b>Frenemies.</b> These companies compete with NVIDIA (custom chips or CPUs) and also buy from, partner with, or take investment from it.</p>${tags(I.frenemies)}</div>
  <div><p><b>Most entangled.</b> Intel holds four different ties at once: NVIDIA investee, supplier, partner and competitor. CoreWeave and Lambda each sell capacity back to NVIDIA.</p>${tags(I.multi.slice(0, 8).map(m => m[0]))}</div>
  <div><p><b>Dense core.</b> The ${I.inner_core.k}-core (each member has at least ${I.inner_core.k} ties to other members, not counting NVIDIA) is the compute power centre.</p>${tags(I.inner_core.members)}</div>
  <div><p><b>Communities.</b> Louvain clustering on the non-NVIDIA links finds these blocs.</p>
  ${I.communities.map(c => `<p style="margin-top:6px"><b>${esc(c.name)}</b> · ${c.size}</p>${tags(c.members.slice(0, 10))}`).join("")}</div>`;
function bindTags(root) { root.querySelectorAll(".tag").forEach(b => b.onclick = () => select(b.dataset.id)); }
bindTags(document.getElementById("insights"));
select(null);
</script>
</body>
</html>
